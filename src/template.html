<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wu Zetian 逐句精读</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#1f1b24; --muted:#6b6672; --line:#e7e2da;
  --teal:#b3261e; --teal-soft:#fbe4e1; --red:#c79a1a; --red-soft:#f8efd2;
  --mustard:#f3c54d; --uhl:#ffd3e1; --uhl-ink:#7a1838; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.05);
  --de-font: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141a; --card:#201d26; --ink:#eeeaf2; --muted:#a39fae; --line:#38343f;
    --teal:#f29b94; --teal-soft:#3d2220; --red:#e6c35c; --red-soft:#38301a;
    --mustard:#e2b443; --uhl:#5a2236; --uhl-ink:#ffd0de; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16141a; --card:#201d26; --ink:#eeeaf2; --muted:#a39fae; --line:#38343f;
  --teal:#f29b94; --teal-soft:#3d2220; --red:#e6c35c; --red-soft:#38301a;
  --mustard:#e2b443; --uhl:#5a2236; --uhl-ink:#ffd0de; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.hero{padding:40px 0 18px}
.hero h1{font-family:var(--de-font);font-weight:600;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;color:var(--teal);letter-spacing:-.01em}
.hero .sub{font-family:var(--de-font);font-style:italic;color:var(--red);font-size:20px;margin:4px 0 14px}
.hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--uhl)}

.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:14px;white-space:nowrap}
a.tab{text-decoration:none;color:inherit;display:inline-block}
.tab.back{border-style:dashed;color:var(--teal)}
.hero-top{display:flex;align-items:center;gap:18px}
.avatar{width:96px;height:auto;flex:0 0 auto;mix-blend-mode:multiply}
.hero{padding-right:0}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#10201e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#10201e}}
.tab small{opacity:.75;margin-left:4px;font-size:12px}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:0 0 10px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:4px 10px}
.seg button[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.ctrl-label{color:var(--muted)}
.progress{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:8px}
.pbar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}

.page-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.page-head h2{margin:0;font-size:22px}
.page-head .pg{font-family:var(--de-font);color:var(--red);font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;margin:0 0 14px;box-shadow:var(--shadow);transition:border-color .2s}
.card.done{border-color:color-mix(in srgb,var(--teal) 55%,var(--line))}
.card.playing{border-color:var(--mustard);box-shadow:0 0 0 3px color-mix(in srgb,var(--mustard) 35%,transparent)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--teal)}
.card-top .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 9px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.icon-btn:hover{border-color:var(--teal);color:var(--teal)}
.icon-btn.on{background:var(--teal-soft);color:var(--teal);border-color:transparent}

.de{font-family:var(--de-font);font-size:21px;line-height:1.55;margin:2px 0 8px;word-break:normal;overflow-wrap:break-word}
.w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.w:hover{background:var(--teal-soft)}
.w.uhl{background:var(--uhl);color:var(--uhl-ink)}
body.hlmode .de .w{border-bottom:1px dashed color-mix(in srgb,var(--uhl-ink) 45%,transparent)}
.uhl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.uhl-head .sp{flex:1}
.vw.u{background:var(--uhl);color:var(--uhl-ink);border-radius:4px;padding:0 4px}
.ctx{font-family:var(--de-font);font-size:14px;color:var(--muted)}
.w.speaking{background:var(--mustard);color:#2a2000}
.zh{color:var(--ink);opacity:.92;font-size:15.5px;margin:0 0 4px;padding-left:10px;border-left:3px solid var(--red)}
.zh.hidden{cursor:pointer;color:transparent;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border-radius:4px;user-select:none}
.zh.hidden::after{content:"点击显示中文";color:var(--muted);font-size:13px;margin-left:-6em}
.zh.hidden *{visibility:hidden}

details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--teal);font-size:13.5px;list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";transition:transform .15s;display:inline-block}
details.more[open] summary::before{transform:rotate(90deg)}
.vocab{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;margin:10px 0 6px;font-size:14.5px}
.vw{font-family:var(--de-font);font-size:16px;cursor:pointer;color:var(--teal);white-space:nowrap;justify-self:start}
.vw:hover{text-decoration:underline}
.vg{color:var(--ink)}
.note{background:color-mix(in srgb,var(--teal-soft) 55%,transparent);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:6px}
.note b{color:var(--teal);font-family:var(--de-font);font-size:15.5px}

.vtools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 12px}
.vtools input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14.5px}
.vlist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:4px 14px;padding:9px 14px;border-top:1px solid var(--line);align-items:baseline}
.vrow:first-child{border-top:0}
.vrow .vw{white-space:normal}
.vrow .src{font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
.vrow .src:hover{color:var(--teal)}
.vgroup{background:var(--bg);padding:6px 14px;font-size:13px;color:var(--red);font-family:var(--de-font);border-top:1px solid var(--line)}
@media (max-width:560px){
  .de{font-size:19px}
  .vocab{grid-template-columns:1fr;gap:0}
  .vocab .vg{margin-bottom:6px}
  .vw{white-space:normal}
  .vrow{grid-template-columns:1fr auto}
  .vrow .vg{grid-column:1/-1;grid-row:2}
  .progress{margin-left:0;width:100%}
}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.comments{margin:26px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
.comments h3{margin:14px 0 4px;font-size:17px}
.comments p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.credit{margin:12px 0 0;font-size:14px;color:var(--muted)}
.credit a{color:var(--teal);text-decoration:none;border-bottom:1px dotted var(--teal)}
footer{color:var(--muted);font-size:13px;padding:30px 0 50px;text-align:center}
.theme-btn{position:absolute;top:14px;right:16px}
.hero{position:relative}

/* ---- comic playground skin ---- */
:root{--hand:"Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive;--ink-line:var(--ink);--pop:var(--teal)}
body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--teal) 16%,transparent) 1.2px,transparent 1.3px);background-size:18px 18px}
.card{border:2px solid var(--ink-line);border-radius:16px;box-shadow:5px 5px 0 var(--pop);transition:transform .15s,box-shadow .15s,border-color .2s}
.card:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--pop)}
.card.done{border-color:var(--ink-line);box-shadow:5px 5px 0 var(--red)}
.card.playing{border-color:var(--ink-line);box-shadow:5px 5px 0 var(--mustard),0 0 0 4px color-mix(in srgb,var(--mustard) 40%,transparent)}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:var(--pop);color:#fff;font-size:12.5px}
:root[data-theme="dark"] .num{color:#16141a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{color:#16141a}}
.card-top{font-family:var(--hand);font-size:14px}
.zh{position:relative;border:0;background:var(--teal-soft);border-radius:14px;padding:8px 14px;margin:10px 0 6px 6px}
.zh::before{content:"";position:absolute;left:18px;top:-9px;border:8px solid transparent;border-bottom-color:var(--teal-soft);border-top:0}
.zh.hidden{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}
.zh.hidden::before{display:none}
.w{border-radius:6px;transition:background .15s,transform .12s}
.w:hover{transform:translateY(-2px) rotate(-1deg)}
.w.speaking{animation:hop .35s ease}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.08)}100%{transform:translateY(0)}}
.w.uhl{background:linear-gradient(transparent 28%,var(--uhl) 28% 92%,transparent 92%);padding:0 2px;border-radius:2px}
.tab{border:2px solid var(--ink-line);font-weight:600}
.tab[aria-selected="true"]{box-shadow:3px 3px 0 var(--red);transform:translateY(-1px)}
.seg,.btn,.icon-btn{border:2px solid var(--ink-line)}
.btn,.icon-btn{border-radius:10px;transition:transform .1s,box-shadow .1s}
.btn:hover,.icon-btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--pop)}
.btn:active,.icon-btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.primary{box-shadow:3px 3px 0 var(--ink-line)}
.page-head h2{font-family:var(--hand);font-size:26px}
.page-head .pg{font-family:var(--hand);font-size:22px;transform:rotate(-3deg);display:inline-block;background:var(--red-soft);padding:0 10px;border-radius:8px}
.hero h1{text-shadow:3px 3px 0 var(--teal-soft)}
.hero .sub{font-family:var(--hand);font-style:normal;font-size:22px}
.avatar{transform:rotate(-3deg);transition:transform .25s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avatar{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}}
:root[data-theme="dark"] .avatar{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}
.avatar:hover{transform:rotate(3deg) scale(1.06)}
.note{border:2px dashed color-mix(in srgb,var(--teal) 55%,transparent);background:color-mix(in srgb,var(--teal-soft) 70%,transparent)}
.pbar{height:10px;border:2px solid var(--ink-line);border-radius:6px}
.pbar i{border-radius:0}
.vlist,.vtools input{border:2px solid var(--ink-line)}
.burst{position:absolute;pointer-events:none;font-size:16px;color:var(--mustard);animation:burst .75s ease-out forwards;z-index:9}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(160deg)}}
.icon-btn.mark{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- text-style page switcher (no boxes) ---- */
.tabs{flex-wrap:wrap;overflow:visible;gap:0 6px;padding:10px 0 4px;align-items:baseline}
.tab,a.tab.back{border:0!important;background:none!important;box-shadow:none!important;transform:none!important;border-radius:6px;padding:1px 7px;font-family:var(--hand);font-size:20px;font-weight:600;color:var(--muted)!important;position:relative}
.tab small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;font-weight:400;opacity:.7;margin-left:2px;vertical-align:super}
.tab:hover{color:var(--ink)!important}
.tab[aria-selected="true"]{color:var(--teal)!important;background:linear-gradient(transparent 58%,var(--teal-soft) 58%)!important;text-decoration:underline wavy var(--teal);text-decoration-thickness:1.5px;text-underline-offset:4px}
a.tab.back{color:var(--teal)!important;font-size:17px;margin-right:8px}
.tab:first-child{margin-right:6px}
@media (max-width:560px){.bar{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <button class="btn theme-btn" id="themeBtn" title="切换深浅色">◐</button>
    <div class="hero-top"><img class="avatar" src="img/wu.png" alt="Wu Zetian" style="width:78px"><div><h1>Wu Zetian</h1>
    <div class="sub">Kaiserin · 624–705</div></div></div>
    <div class="legend">
      <span>✓ 学会了就勾上，进度会保存在这台设备的浏览器里</span>
    </div>
    <p class="credit">♥ 为爱发电：<a href="https://afdian.com/a/einwohnervonb612" target="_blank" rel="noopener">小怪</a></p>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="ctrls">
      <span class="ctrl-label">点单词</span>
      <div class="seg" id="modeSeg"><button data-v="say">发音</button><button data-v="hl">高亮</button></div>
      <span class="ctrl-label">语速</span>
      <div class="seg" id="rateSeg"><button data-r="0.6">慢</button><button data-r="0.85">中</button><button data-r="1">正常</button></div>
      <span class="ctrl-label">中文</span>
      <div class="seg" id="zhSeg"><button data-v="show">显示</button><button data-v="hide">遮住自测</button></div>
      <span class="ctrl-label">讲解</span>
      <div class="seg" id="exSeg"><button data-v="open">展开</button><button data-v="closed">收起</button></div>
      <div class="progress"><span id="progTxt">0 / 0</span><div class="pbar"><i id="progBar"></i></div></div>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>
<div class="wrap"><footer>为爱发电：<a href="https://afdian.com/a/einwohnervonb612" target="_blank" rel="noopener" style="color:inherit">小怪</a><br>内容整理自 Pénélope Bagieu《Unerschrocken》德语版，仅供语言学习，原作版权归作者与出版社所有。发音由浏览器自带的德语语音合成。 <a href="./" style="color:inherit">← 返回目录</a></footer></div>
<div class="toast" id="toast"></div>

<script>
const PAGES = {
};

const S = [
];



const store = {
  get(k, d){ try{ const v = localStorage.getItem("wz_"+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("wz_"+k, JSON.stringify(v)); }catch(e){} }
};
const state = {
  tab: store.get("tab", "137"),
  rate: store.get("rate", 0.85),
  zh: store.get("zh", "show"),
  ex: store.get("ex", "open"),
  done: store.get("done", {}),
  mode: "say",
  uhl: store.get("uhl", {})
};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SENT = S.map((s,i)=>({i, p:s[0], de:s[1], zh:s[2], v:s[3], note:s[4]}));
const PAGE_IDS = Object.keys(PAGES);

/* ---------- Speech ---------- */
let deVoice = null, voiceWarned = false;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^de(-|_|$)/i.test(v.lang));
  const pref = ["Natural","Online","Google Deutsch","Katja","Conrad","Anna","Helena","Petra","Markus"];
  deVoice = pref.map(p => vs.find(v => v.name.includes(p))).find(Boolean) || vs.find(v => /de-DE/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }

function speak(text, opts={}){
  if(!("speechSynthesis" in window)){ toast("这个浏览器不支持语音朗读，换 Chrome / Safari / Edge 试试"); return null; }
  if(!opts.queue) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; u.rate = opts.rate || state.rate;
  if(deVoice) u.voice = deVoice;
  else if(!voiceWarned){ voiceWarned = true; setTimeout(()=>{ if(!deVoice) toast("没找到德语语音，可能会用默认语音朗读。可以在系统设置里添加德语语音包。"); }, 400); }
  if(opts.onend) u.onend = opts.onend;
  if(opts.onerror) u.onerror = opts.onerror;
  speechSynthesis.speak(u);
  return u;
}
const ABBR = [[/\bjdm\./g,"jemandem"],[/\bjdn\./g,"jemanden"],[/\bjds\./g,"jemandes"],[/\betw\./g,"etwas"]];
function speakable(head){
  let s = head.replace(/\(.*?\)/g," ").split(/\s\+\s|\s=\s/)[0];
  s = s.replace(/,\s*[-–]?\w*$/u,"").replace(/,\s*[A-ZÄÖÜa-zäöüß-]+$/u,"");
  ABBR.forEach(([r,t]) => s = s.replace(r,t));
  s = s.replace(/[^\p{Script=Latin}\d\s.\-’'!?]/gu," ").replace(/\.\.\.|…/g," ").replace(/\s+/g," ").trim();
  return s;
}

/* ---------- Rendering ---------- */
const TOKEN_RE = /^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u;
function tokenHTML(de, si){
  let k = -1;
  return de.split(/(\s+)/).map(part => {
    if(/^\s+$/.test(part) || part==="") return part;
    const m = part.match(TOKEN_RE);
    const [_, pre, core, post] = m;
    if(!core) return esc(part);
    k++;
    const u = state.uhl[si+":"+k] ? " uhl" : "";
    return esc(pre) + `<span class="w${u}" data-k="${si}:${k}" data-say="${esc(core)}">${esc(core)}</span>` + esc(post);
  }).join("");
}
function cardHTML(s){
  const done = !!state.done[s.i];
  const vocab = s.v.map(([w,g]) =>
    `<span class="vw" data-say="${esc(speakable(w))}" title="点击发音">${esc(w)}</span><span class="vg">${esc(g)}</span>`).join("");
  return `<article class="card${done?" done":""}" id="s${s.i}" data-i="${s.i}">
    <div class="card-top"><span class="num">${s.i+1}</span><span>第 ${s.p} 页</span><span class="sp"></span>
      <button class="icon-btn play" title="朗读整句">▶ 朗读</button>
      <button class="icon-btn mark${done?" on":""}" title="标记为已学会">${done?"✓ 已学会":"○ 学会了"}</button></div>
    <div class="de">${tokenHTML(s.de, s.i)}</div>
    <div class="zh${state.zh==="hide"?" hidden":""}"><span>${esc(s.zh)}</span></div>
    <details class="more"${state.ex==="open"?" open":""}><summary>词汇与语法</summary>
      <div class="vocab">${vocab}</div>
      <div class="note">${s.note}</div>
    </details>
  </article>`;
}

function renderTabs(){
  const counts = {};
  SENT.forEach(s => { counts[s.p] = counts[s.p]||[0,0]; counts[s.p][1]++; if(state.done[s.i]) counts[s.p][0]++; });
  $("#tabs").innerHTML = `<a class="tab back" href="./">← 目录</a>` + PAGE_IDS.map(p =>
    `<button class="tab" role="tab" data-tab="${p}" aria-selected="${state.tab===p}">${p}<small>${counts[p][0]}/${counts[p][1]}</small></button>`).join("")
    + `<button class="tab" role="tab" data-tab="vocab" aria-selected="${state.tab==="vocab"}">词汇表</button>`;
  const n = SENT.length, d = Object.keys(state.done).filter(k=>state.done[k]).length;
  $("#progTxt").textContent = `已学会 ${d} / ${n}`;
  $("#progBar").style.width = (d/n*100)+"%";
}

function renderPage(){
  const main = $("#main");
  if(state.tab === "vocab"){ renderVocab(); return; }
  const p = state.tab, list = SENT.filter(s => String(s.p) === p);
  const idx = PAGE_IDS.indexOf(p);
  main.innerHTML = `<div class="page-head"><span class="pg">第 ${p} 页</span><h2>${PAGES[p]}</h2>
      <span style="flex:1"></span><button class="btn" id="playAll">▶ 连读本页</button></div>`
    + list.map(cardHTML).join("")
    + `<div style="display:flex;justify-content:space-between;gap:10px;margin:18px 0">
        ${idx>0?`<button class="btn" data-go="${PAGE_IDS[idx-1]}">← 第 ${PAGE_IDS[idx-1]} 页</button>`:"<span></span>"}
        ${idx<PAGE_IDS.length-1?`<button class="btn primary" data-go="${PAGE_IDS[idx+1]}">第 ${PAGE_IDS[idx+1]} 页 →</button>`:`<button class="btn primary" data-go="vocab">去复习词汇表 →</button>`}
      </div>
      <section class="comments"><h3>讨论与备注 · 第 ${p} 页</h3><p>想补充或提问？在下面留言时请写上句子序号（如“第 3 句”）。需要用 GitHub 账号登录。</p><div id="gc"></div></section>`;
  loadComments(p);
}

/* ---------- Comments (giscus) ---------- */
const GISCUS = {repo:"iqnuxul/unerschrocken-reader", repoId:"R_kgDOVJoqpg", category:"Announcements", categoryId:"DIC_kwDOVJoqps4DIcKu"};
function loadComments(p){
  const box = $("#gc"); if(!box || !GISCUS.repoId || !/^https?:$/.test(location.protocol)) return;
  box.innerHTML = "";
  const s = document.createElement("script");
  s.src = "https://giscus.app/client.js"; s.async = true; s.crossOrigin = "anonymous";
  const a = {"data-repo":GISCUS.repo, "data-repo-id":GISCUS.repoId, "data-category":GISCUS.category, "data-category-id":GISCUS.categoryId,
    "data-mapping":"specific", "data-term":"wz-p"+p, "data-strict":"0", "data-reactions-enabled":"1", "data-emit-metadata":"0",
    "data-input-position":"top", "data-theme":"preferred_color_scheme", "data-lang":"zh-CN", "data-loading":"lazy"};
  Object.entries(a).forEach(([k,v]) => s.setAttribute(k,v));
  box.appendChild(s);
}
let vocabFilter = {q:""};
function renderVocab(){
  const main = $("#main");
  main.innerHTML = `<div class="page-head"><span class="pg">Wortschatz</span><h2>词汇表</h2></div>
    <div class="vtools"><input id="vq" type="search" placeholder="搜索德语或中文…" value="${esc(vocabFilter.q)}"></div>
    <div id="ulist"></div>
    <div class="vlist" id="vlist"></div>`;
  fillUser(); fillVocab();
}
function fillUser(){
  const keys = Object.keys(state.uhl).sort((a,b)=>{const [a1,a2]=a.split(":").map(Number),[b1,b2]=b.split(":").map(Number);return a1-b1||a2-b2;});
  const q = vocabFilter.q.trim().toLowerCase();
  const rows = keys.filter(k => !q || state.uhl[k].toLowerCase().includes(q)).map(k => {
    const i = +k.split(":")[0], s = SENT[i], w = state.uhl[k];
    const wl = w.toLowerCase();
    const toks = v => (speakable(v[0]).toLowerCase().match(/[\p{L}ß-]+/gu) || []);
    const hit = s.v.find(v => toks(v).some(t => t === wl)) ||
                (wl.length >= 5 ? s.v.find(v => toks(v).some(t => t.length >= 5 && (t.startsWith(wl.slice(0,5)) || wl.startsWith(t.slice(0,5))))) : null);
    const ctx = esc(s.de).replace(new RegExp("(^|[^\\p{L}])(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")(?![\\p{L}])","u"), "$1<b>$2</b>");
    return `<div class="vrow"><span class="vw u" data-say="${esc(w)}">${esc(w)}</span><span class="vg">${hit?esc(hit[1])+"<br>":""}<span class="ctx">${ctx}</span></span><span class="src"><span data-jump="${i}" title="跳到原句">第 ${i+1} 句 ↗</span> · <span data-unhl="${k}" title="取消高亮">✕</span></span></div>`;
  });
  $("#ulist").innerHTML = keys.length ? `<div class="uhl-head" style="margin:4px 0 8px"><b>我标的词</b><span class="ctrl-label">${keys.length} 个</span><span class="sp"></span><button class="btn" id="uClear">全部清除</button></div><div class="vlist" style="margin-bottom:22px">${rows.join("") || `<div class="vrow"><span class="vg">没有匹配的词</span></div>`}</div><div style="margin:0 0 8px"><b>每句的重点词</b></div>`
    : `<p class="ctrl-label" style="margin:0 0 14px">还没有标过词：把上方“点单词”切到“高亮”，再点句子里的生词，就会汇总在这里。</p>`;
}
function fillVocab(){
  const q = vocabFilter.q.trim().toLowerCase();
  let html = "", last = null, count = 0;
  SENT.forEach(s => s.v.forEach(([w,g]) => {
    if(q && !(w.toLowerCase().includes(q) || g.toLowerCase().includes(q))) return;
    if(s.p !== last){ html += `<div class="vgroup">第 ${s.p} 页 · ${PAGES[s.p]}</div>`; last = s.p; }
    html += `<div class="vrow"><span class="vw" data-say="${esc(speakable(w))}">${esc(w)}</span><span class="vg">${esc(g)}</span><span class="src" data-jump="${s.i}" title="跳到原句">第 ${s.i+1} 句 ↗</span></div>`;
    count++;
  }));
  $("#vlist").innerHTML = html || `<div class="vrow"><span class="vg">没有找到匹配的词</span></div>`;
}

function syncSegs(){
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state.mode)));
  document.body.classList.toggle("hlmode", state.mode==="hl");
  document.querySelectorAll("#rateSeg button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === +state.rate)));
  document.querySelectorAll("#zhSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state.zh)));
  document.querySelectorAll("#exSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state.ex)));
}
function go(tab, scrollTo){
  state.tab = tab; store.set("tab", tab);
  stopAll(); renderTabs(); renderPage();
  if(scrollTo != null){ const el = document.getElementById("s"+scrollTo); if(el){ el.scrollIntoView({block:"center"}); el.classList.add("playing"); setTimeout(()=>el.classList.remove("playing"),1600);} }
  else window.scrollTo({top: Math.min(window.scrollY, document.querySelector(".bar").offsetTop)});
}

/* ---------- Playback ---------- */
let playToken = 0;
function stopAll(){ playToken++; if("speechSynthesis" in window) speechSynthesis.cancel(); document.querySelectorAll(".card.playing").forEach(c=>c.classList.remove("playing")); }
function playCard(card, then){
  const s = SENT[+card.dataset.i];
  card.classList.add("playing");
  const my = playToken;
  speak(s.de.replace(/[„“”"()]/g,""), { onend: () => { card.classList.remove("playing"); if(my===playToken && then) then(); },
                                       onerror: () => card.classList.remove("playing") });
}
function playAll(){
  stopAll();
  const cards = [...document.querySelectorAll("#main .card")];
  const my = playToken;
  const step = k => { if(my!==playToken || k>=cards.length) return; cards[k].scrollIntoView({block:"center",behavior:"smooth"}); playCard(cards[k], () => setTimeout(()=>step(k+1), 450)); };
  step(0);
}

/* ---------- Fun ---------- */
function burst(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let k=0;k<8;k++){
    const s=document.createElement("span"); s.className="burst"; s.textContent=["✦","★","✧"][k%3];
    const ang=k/8*Math.PI*2, r=26+Math.random()*16;
    s.style.cssText=`left:50%;top:50%;--dx:${Math.cos(ang)*r}px;--dy:${Math.sin(ang)*r}px`;
    el.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const mb = t.closest("#modeSeg button"); if(mb){ state.mode = mb.dataset.v; syncSegs(); toast(state.mode==="hl" ? "高亮模式：点单词标记/取消，同时发音" : "发音模式：点单词只发音"); return; }
  const un = t.closest("[data-unhl]"); if(un){ delete state.uhl[un.dataset.unhl]; store.set("uhl", state.uhl); fillUser(); return; }
  if(t.closest("#uClear")){ if(Object.keys(state.uhl).length){ state.uhl = {}; store.set("uhl", state.uhl); fillUser(); toast("已清除标记的词"); } return; }
  const tw = t.closest(".de .w");
  if(tw && state.mode==="hl"){
    const k = tw.dataset.k;
    if(state.uhl[k]) delete state.uhl[k]; else state.uhl[k] = tw.dataset.say;
    store.set("uhl", state.uhl); tw.classList.toggle("uhl", !!state.uhl[k]);
  }
  const w = t.closest(".w, .vw");
  if(w){ document.querySelectorAll(".w.speaking").forEach(x=>x.classList.remove("speaking"));
         if(w.classList.contains("w")) w.classList.add("speaking");
         stopAll(); speak(w.dataset.say, {onend:()=>w.classList.remove("speaking"), onerror:()=>w.classList.remove("speaking")}); return; }
  const tab = t.closest("[data-tab]"); if(tab){ go(tab.dataset.tab); return; }
  const g = t.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const j = t.closest("[data-jump]"); if(j){ const i=+j.dataset.jump; go(String(SENT[i].p), i); return; }
  if(t.closest("#playAll")){ playAll(); return; }
  const card = t.closest(".card");
  if(card && t.closest(".play")){ stopAll(); playCard(card); return; }
  if(card && t.closest(".mark")){
    const i = +card.dataset.i; state.done[i] = !state.done[i]; if(!state.done[i]) delete state.done[i];
    store.set("done", state.done);
    const b = t.closest(".mark"); b.classList.toggle("on", !!state.done[i]); b.textContent = state.done[i] ? "✓ 已学会" : "○ 学会了";
    card.classList.toggle("done", !!state.done[i]); if(state.done[i]) burst(b); renderTabs(); return; }
  const zh = t.closest(".zh.hidden"); if(zh){ zh.classList.remove("hidden"); return; }
  const rb = t.closest("#rateSeg button"); if(rb){ state.rate = +rb.dataset.r; store.set("rate", state.rate); syncSegs(); speak("Kaiserin"); return; }
  const zb = t.closest("#zhSeg button"); if(zb){ state.zh = zb.dataset.v; store.set("zh", state.zh); syncSegs();
    document.querySelectorAll(".zh").forEach(z => z.classList.toggle("hidden", state.zh==="hide")); return; }
  const eb = t.closest("#exSeg button"); if(eb){ state.ex = eb.dataset.v; store.set("ex", state.ex); syncSegs();
    document.querySelectorAll("details.more").forEach(d => d.open = state.ex==="open"); return; }
  if(t.closest("#themeBtn")){
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme); return; }
});
document.addEventListener("input", e => { if(e.target.id==="vq"){ vocabFilter.q = e.target.value; fillUser(); fillVocab(); } });

const th = store.get("theme", null); if(th) document.documentElement.dataset.theme = th;
if(!PAGE_IDS.includes(state.tab) && state.tab!=="vocab") state.tab = PAGE_IDS[0];
syncSegs(); renderTabs(); renderPage();
</script>
</body>
</html>
