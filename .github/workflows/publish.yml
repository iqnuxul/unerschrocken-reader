name: 发布图书馆

on:
  push:
    branches: [main]
    paths:
      - "src/books/**"
      - "src/template.html"
      - "src/site.py"
  workflow_dispatch:
    inputs:
      files:
        description: "要重新生成的章节文件（如 src/books/momo/kapitel1.js），空格分开；留空 = 全部"
        required: false

permissions:
  contents: write

concurrency:
  group: publish-library
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 找出要生成的章节
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          FILES: ${{ github.event.inputs.files }}
        run: |
          all=$(ls src/books/*/*.js 2>/dev/null | grep -E '(kapitel|_ch)[0-9]+(_data)?\.js$' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="${FILES:-$all}"
          elif git diff --name-only "$BEFORE" HEAD -- src/template.html src/site.py 'src/books/*/book.json' | grep -q . ; then
            files="$all"
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'src/books/*/*.js' | grep -E '(kapitel|_ch)[0-9]+(_data)?\.js$' || true)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"; echo "$files" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "将生成：$files"

      - name: 生成并加密章节
        if: steps.pick.outputs.files != ''
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python3 src/site.py build ${{ steps.pick.outputs.files }}

      - name: 更新书架和目录页
        run: python3 src/site.py pages

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' ':!src/**'
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "自动发布图书馆"
          git push
